<svg xmlns="http://www.w3.org/2000/svg" width="600" height="230" viewBox="0 0 600 230">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161b26"/>
      <stop offset="1" stop-color="#10141c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
    <clipPath id="c"><rect width="600" height="230" rx="16"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="599" height="229" rx="16" fill="url(#g)" stroke="#2a3140"/>
  <rect x="0" y="0" width="600" height="5" fill="url(#accent)" clip-path="url(#c)"/>

  <!-- icon: lit screen with a smiling face -->
  <g transform="translate(32,34)">
    <rect width="56" height="56" rx="14" fill="#ffffff" opacity="0.95"/>
    <rect x="14" y="14" width="28" height="28" rx="7" fill="#1b2230"/>
    <circle cx="23" cy="25" r="2.2" fill="#4cc2ff"/>
    <circle cx="33" cy="25" r="2.2" fill="#4cc2ff"/>
    <path d="M21 31 q7 6 14 0" stroke="#4cc2ff" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  </g>

  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
    <text x="108" y="58" font-size="26" font-weight="700" fill="#f1f4f8">Windows Hello Brightener</text>
    <text x="108" y="84" font-size="16" fill="#ff9d4d" font-weight="600">Face sign-in that works in the dark</text>

    <text x="32" y="130" font-size="17.5" fill="#aab4c3">Lights up your screen around Windows Hello and passkey</text>
    <text x="32" y="155" font-size="17.5" fill="#aab4c3">prompts so the camera can see you. Made for Tobii 5.</text>

    <circle cx="38" cy="196" r="6" fill="#178600"/>
    <text x="52" y="201" font-size="15" fill="#c9d1d9">C#</text>
    <text x="96" y="201" font-size="15" fill="#6e7a8a">Windows  ·  Zero setup  ·  18 KB</text>
    <text x="568" y="201" font-size="15" fill="#ff9d4d" text-anchor="end" font-weight="600">View →</text>
  </g>
</svg>
