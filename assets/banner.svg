<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#141a26"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffd2a8"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#bg)"/>

    <!-- soft drifting glows -->
    <g filter="url(#blur)" opacity="0.85">
      <circle cx="930" cy="120" r="110" fill="#ff7a1a">
        <animate attributeName="cx" values="930;990;930" dur="14s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="120;160;120" dur="11s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1080" cy="230" r="90" fill="#ffb347" opacity="0.7">
        <animate attributeName="cx" values="1080;1020;1080" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle cx="160" cy="300" r="120" fill="#3b5bdb" opacity="0.45">
        <animate attributeName="cy" values="300;250;300" dur="13s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- subtle dot grid -->
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.06"/>
    </pattern>
    <rect width="1200" height="300" fill="url(#dots)"/>

    <!-- text -->
    <text x="80" y="130" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#ff9d4d" letter-spacing="4">HI, I'M</text>
    <text x="76" y="202" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="72" font-weight="800" fill="url(#title)">Adaks</text>


    <rect x="0.5" y="0.5" width="1199" height="299" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  </g>
</svg>
